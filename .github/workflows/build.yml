name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Bundle current server list into the app
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --max-time 90 -A "FreeVPN-Updater/1.0" https://www.vpngate.net/api/iphone/ -o app/src/main/assets/servers.csv \
            || curl -fsSL --max-time 90 "https://github.com/${{ github.repository }}/raw/servers/servers.csv" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o app/src/main/assets/servers.csv \
            || echo "Could not bundle list"
          ls -l app/src/main/assets || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreeVPN.apk

      # Publishes the APK as a GitHub Release so you can download it
      # straight from your phone: github.com/<you>/<repo>/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FreeVPN.apk \
            --title "Free VPN (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download FreeVPN.apk below and open it on your Android phone."
