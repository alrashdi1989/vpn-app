name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreeVPN.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeVPN-apk
          path: FreeVPN.apk

      # Publishes the APK as a GitHub Release so you can download it
      # straight from your phone: github.com/<you>/<repo>/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FreeVPN.apk \
            --title "Free VPN (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download FreeVPN.apk below and open it on your Android phone."
